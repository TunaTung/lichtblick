<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小车遥控 · RC2 通信版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#202a35;font:16px/1.6 "Microsoft YaHei",sans-serif}
main{max-width:580px;margin:6vh auto;padding:28px;background:white;border-radius:18px;box-shadow:0 8px 40px #2233440d}
h1{font-size:26px;margin:0 0 6px}p{margin:8px 0;color:#66717f}.status{padding:12px 16px;background:#eef2f6;border-radius:10px;margin:20px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{font:inherit;font-weight:600;min-height:90px;border:1px solid #dce2e8;border-radius:12px;background:#f6f8fa;color:#243246;touch-action:none;user-select:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}button.active{background:#245edb;color:#fff;border-color:#245edb}button.stop{color:#b32424;background:#fff1f1;border-color:#f0c6c6}small{display:block;color:#7c8793;margin-top:20px}
.details{font-size:14px;min-height:25px} @media(max-width:620px){main{margin:16px;padding:20px}button{min-height:80px}}
.speed-row{display:flex;align-items:center;gap:12px;margin:16px 0}.speed-row select{flex:1;padding:10px;font:inherit;border:1px solid #dce2e8;border-radius:10px;background:#fff}
</style>
<main>
<h1>小车遥控</h1>
<p>RC2 通信版 · 按住行驶，松开停车</p>
<div class="status" id="status" role="status">正在连接控制器…</div>
<div class="speed-row"><label for="speed">速度档位</label><select id="speed" disabled><option value="normal">标准档 · 当前速度</option><option value="fast">高速档 · 1.5倍</option></select></div>
<p class="details" id="speed-info">默认标准档，松开停车后可换档。</p>
<div class="pad">
<button data-cmd="strafe_left" disabled>左平移</button>
<button data-cmd="forward" disabled>前进</button>
<button data-cmd="strafe_right" disabled>右平移</button>
<button data-cmd="spin_left" disabled>原地左转</button>
<button class="stop" id="stop">停车</button>
<button data-cmd="spin_right" disabled>原地右转</button>
<span></span><button data-cmd="backward" disabled>后退</button><span></span>
</div>
<p class="details" id="details">等待小车连接</p>
<p class="details" id="diagnostic">等待主板诊断</p>
<table style="width:100%;font-size:14px;text-align:right">
<thead><tr><th>车轮</th><th>目标 RPM</th><th>实测 RPM</th><th>输出 %</th></tr></thead>
<tbody id="wheels"><tr><td colspan="4">等待真实编码器与输出数据</td></tr></tbody>
</table>
<small>按住行驶，松开停车。换档后重新按键起步；重连默认回到标准档。首次测试高速档请架空车轮。</small>
</main>
<script src="/control.js"></script>
</html>
